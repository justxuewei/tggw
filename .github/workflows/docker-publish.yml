name: Publish Docker image

# Build and push the gateway image to Docker Hub on every push to main
# (tag `latest` + the commit SHA) and on version tags `v*` (semver tags).
on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: xavierniu/tggw

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Log in before Buildx setup so Buildx's moby/buildkit image pull is
      # authenticated (anonymous Docker Hub pulls get rate-limited on runners).
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Notify Telegram via tggw only for main (where `latest` is published).
      - name: Notify tggw
        if: github.ref == 'refs/heads/main'
        env:
          TGGW_API_TOKEN: ${{ secrets.TGGW_API_TOKEN }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          curl -fsS -X POST https://tggw.xavierniu.cc/api/messages \
            -H "Authorization: Bearer ${TGGW_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg t "${IMAGE}:latest has been updated to docker hub, SHA is ${IMAGE_DIGEST}" '{text: $t}')"
