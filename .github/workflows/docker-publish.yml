name: Publish Docker image

# Build and push the gateway image to Docker Hub on every push to main
# (tag `latest` + the commit SHA), on version tags `v*` (semver tags), or on
# manual dispatch. Modeled on token-exporter/.github/workflows/docker-publish.yml.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}
  IMAGE_NAME: tggw
  TGGW_MESSAGES_URL: ${{ vars.TGGW_MESSAGES_URL || 'https://tggw.xavierniu.cc/api/messages' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Log in before Buildx setup so Buildx's moby/buildkit image pull is
      # authenticated (anonymous Docker Hub pulls get rate-limited on runners).
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=git-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify tggw
        if: success()
        env:
          TGGW_API_TOKEN: ${{ secrets.TGGW_API_TOKEN }}
          IMAGE_NAME: ${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_NAME }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          tag="latest"
          hub_url="https://hub.docker.com/r/${IMAGE_NAME}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          commit_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          digest_hex="${IMAGE_DIGEST#sha256:}"
          short_digest="${digest_hex:0:8}"
          short_sha="${GITHUB_SHA:0:8}"
          message="$(printf '%s\n' \
            "<b>GitHub Actions</b>" \
            "Docker image <a href=\"${hub_url}\">${IMAGE_NAME}:${tag}</a> has been pushed" \
            "digest: ${short_digest}" \
            "commit: <a href=\"${commit_url}\">${short_sha}</a>" \
            "link: <a href=\"${run_url}\">GitHub Workflow</a>")"

          curl -fsS -X POST "$TGGW_MESSAGES_URL" \
            -H "Authorization: Bearer ${TGGW_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg text "$message" '{text: $text, parse_mode: "HTML"}')"

      - name: Notify tggw on failure
        if: failure()
        env:
          TGGW_API_TOKEN: ${{ secrets.TGGW_API_TOKEN }}
          IMAGE_NAME: ${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          commit_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          short_sha="${GITHUB_SHA:0:8}"
          message="$(printf '%s\n' \
            "<b>GitHub Actions</b>" \
            "Docker image ${IMAGE_NAME} publish failed" \
            "commit: <a href=\"${commit_url}\">${short_sha}</a>" \
            "link: <a href=\"${run_url}\">GitHub Workflow</a>")"

          curl -fsS -X POST "$TGGW_MESSAGES_URL" \
            -H "Authorization: Bearer ${TGGW_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg text "$message" '{text: $text, parse_mode: "HTML"}')"
