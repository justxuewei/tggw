services:
  tggw:
    image: ${IMAGE:-xavierniu/tggw:latest}
    build: .
    restart: unless-stopped
    environment:
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:?set API_AUTH_TOKEN}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:?set TELEGRAM_CHAT_ID}
      WEBHOOK_PATH: ${WEBHOOK_PATH:-/api/messages}
      GRAFANA_PATH: ${GRAFANA_PATH:-/api/grafana}
      GRAFANA_TEMPLATE: ${GRAFANA_TEMPLATE:-vps-network-monitoring}
      TELEGRAM_PARSE_MODE: ${TELEGRAM_PARSE_MODE:-}
      TELEGRAM_TIMEOUT_SECONDS: ${TELEGRAM_TIMEOUT_SECONDS:-10}
      MAX_MESSAGE_CHARS: ${MAX_MESSAGE_CHARS:-3900}
      RECORD_DB_PATH: ${RECORD_DB_PATH:-/data/tggw-records.db}
      RECORD_TTL_HOURS: ${RECORD_TTL_HOURS:-24}
      EDIT_WINDOW_HOURS: ${EDIT_WINDOW_HOURS:-47}
      ROLLOVER_HOURS: ${ROLLOVER_HOURS:-24}
      # Timezone for the started/updated timestamps (needs tzdata, in the image).
      TZ: ${TZ:-UTC}
    volumes:
      - tggw_data:/data
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - tggw
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
  tggw_data:
